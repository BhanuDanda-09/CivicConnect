global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Smart Civic Backend API Metrics (scrapes prom-client endpoint)
  - job_name: 'civic-backend'
    scrape_interval: 10s
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['backend:5000']


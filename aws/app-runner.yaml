version: 1.0
runtime: nodejs20
build:
  commands:
    build:
      - npm ci --prefix backend --omit=dev
run:
  command: node backend/server.js
  network:
    port: 5000
    env: APP_PORT
  env:
    - name: NODE_ENV
      value: production
    - name: CLIENT_URL
      value: https://civic-connect-two-mu.vercel.app


apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: civic-ingress
  labels:
    app: civic-complaint
  annotations:
    kubernetes.io/ingress.class: "nginx"
    nginx.ingress.kubernetes.io/proxy-body-size: "20m"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          # Route all /api requests to the Express backend microservice
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: civic-backend-service
                port:
                  number: 5000

          # Route all other web traffic to the React + Nginx frontend
          - path: /
            pathType: Prefix
            backend:
              service:
                name: civic-frontend-service
                port:
                  number: 80

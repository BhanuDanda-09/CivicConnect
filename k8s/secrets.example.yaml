# ==============================================================================
# Kubernetes Secret Template (Example)
# In production, create this via 'kubectl create secret generic civic-secrets ...'
# or apply this template after replacing base64 values. DO NOT commit real secrets!
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: civic-secrets
  labels:
    app: civic-complaint
type: Opaque
stringData:
  # MongoDB Atlas Connection String
  MONGODB_URI: "mongodb+srv://<username>:<password>@cluster0.mongodb.net/smart_civic_db?retryWrites=true&w=majority"
  
  # JWT Secret
  JWT_SECRET: "k8s_super_secure_jwt_secret_key_production"
  JWT_EXPIRE: "7d"
  
  # Cloudinary Credentials
  CLOUDINARY_CLOUD_NAME: "your_cloud_name"
  CLOUDINARY_API_KEY: "your_api_key"
  CLOUDINARY_API_SECRET: "your_api_secret"

